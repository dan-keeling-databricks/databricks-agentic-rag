# Evaluation reads the managed dataset and saved scorers without reseeding.
resources:
  jobs:
    evaluate_agent:
      name: PDF RAG - MLflow evaluation
      max_concurrent_runs: 1
      parameters:
      - name: dataset_version
        default: ''
      - name: scorer_versions
        default: '{}'
      tasks:
      - task_key: benchmark
        environment_key: evaluation
        notebook_task:
          notebook_path: ../notebooks/evaluate_agent.py
          base_parameters:
            source_root: ${workspace.file_path}
            dataset_name: ${var.catalog}.${var.schema}.evaluation_questions
            experiment_id: ${resources.experiments.tracing.id}
            agent_endpoint: ${var.catalog}.${var.schema}.agent_model
            judge_endpoint: ${var.catalog}.${var.schema}.judge_model
            index_name: ${var.catalog}.${var.schema}.document_index
            warehouse_id: ${var.warehouse_id}
            dataset_version: '{{job.parameters.dataset_version}}'
            scorer_versions: '{{job.parameters.scorer_versions}}'
      environments:
      - environment_key: evaluation
        spec:
          environment_version: '2'
          dependencies:
          - databricks-sdk==0.170.0
          - databricks-agents==1.13.0
          - openai==2.54.0
          - mlflow-skinny==3.18.0
          - langgraph==1.2.23
          - pandas>=2.2,<3
