resources:
  jobs:
    evaluate_agent:
      name: PDF RAG - evaluate answers
      max_concurrent_runs: 1
      parameters:
        - name: question_limit
          default: '0'
      tasks:
        - task_key: benchmark
          environment_key: evaluation
          spark_python_task:
            python_file: ../scripts/run_evaluation.py
            parameters:
              - --agent-endpoint
              - ${var.catalog}.${var.schema}.agent_model
              - --judge-endpoint
              - ${var.catalog}.${var.schema}.judge_model
              - --index
              - ${var.catalog}.${var.schema}.document_index
              - --experiment-id
              - ${resources.experiments.tracing.id}
              - --warehouse-id
              - ${var.warehouse_id}
              - --limit
              - '{{job.parameters.question_limit}}'
      environments:
        - environment_key: evaluation
          spec:
            # Python 3.11, matching Databricks Apps; this job calls APIs and needs no Spark runtime features.
            environment_version: '2'
            dependencies:
              - databricks-sdk==0.170.0
              - openai==2.54.0
              # GenAI evaluation/tracing are included; omit unused ML training/server libraries.
              - mlflow-skinny==3.18.0
              - langgraph==1.2.23
              - pandas>=2.2,<3
